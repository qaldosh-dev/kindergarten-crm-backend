spring:
  application:
    name: kindergarten
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/kindergarten}
    username: ${DB_USER:kindergarten}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
app:
  timezone: Asia/Qyzylorda
  jwt-secret: ${JWT_SECRET:}
  token-lifetime: PT2H
  admin-login: ${ADMIN_LOGIN:}
  admin-password: ${ADMIN_PASSWORD:}
